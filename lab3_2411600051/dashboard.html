<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Pro | Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-fittrack">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="dashboard.html">
        <i class="bi bi-activity"></i> FitTrack Pro
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <span class="nav-link"><i class="bi bi-person-circle"></i> <span id="navUsername">User</span></span>
          </li>
          <li class="nav-item">
            <button id="logoutBtn" class="btn btn-sm btn-logout ms-lg-2 mt-2 mt-lg-0">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex">

    <nav class="sidebar" style="width: 220px;">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="#"><i class="bi bi-speedometer2"></i> Overview</a>
        </li>
      </ul>
    </nav>

    <main class="dashboard-main flex-grow-1">

      <div class="welcome-banner">
        <h2 id="greetingText">Welcome back!</h2>
        <p class="mb-0" id="greetingSub">Here's your fitness summary for today.</p>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card" id="stat1">
            <div class="stat-icon"><i class="bi bi-shoe-prints"></i></div>
            <div class="stat-title" id="stat1-title">Steps Today</div>
            <div class="stat-value" id="stat1-value">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" id="stat2">
            <div class="stat-icon"><i class="bi bi-fire"></i></div>
            <div class="stat-title" id="stat2-title">Calories Burned</div>
            <div class="stat-value" id="stat2-value">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" id="stat3">
            <div class="stat-icon"><i class="bi bi-lightning-charge-fill"></i></div>
            <div class="stat-title" id="stat3-title">Workouts This Week</div>
            <div class="stat-value" id="stat3-value">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" id="stat4">
            <div class="stat-icon"><i class="bi bi-heart-pulse"></i></div>
            <div class="stat-title" id="stat4-title">Avg Heart Rate</div>
            <div class="stat-value" id="stat4-value">0</div>
          </div>
        </div>
      </div>

      <div class="section-card">
        <h5><i class="bi bi-flag"></i> Weekly Goal Progress</h5>
        <div class="d-flex justify-content-between mb-1">
          <span>50,000 steps / week</span>
          <span id="goalPercent">0%</span>
        </div>
        <div class="progress progress-fittrack">
          <div class="progress-bar" id="goalProgressBar" role="progressbar" style="width: 0%;"></div>
        </div>
      </div>

      <div class="section-card">
        <h5><i class="bi bi-clock-history"></i> Recent Activity</h5>
        <div class="table-responsive">
          <table class="table table-fittrack align-middle">
            <thead>
              <tr>
                <th>Date</th>
                <th>Activity</th>
                <th>Duration</th>
                <th>Calories</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="activityTableBody">

            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
