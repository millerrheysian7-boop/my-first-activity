<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Pro | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="card login-card">
    <div class="login-card-header">
      <div class="brand-icon"><i class="bi bi-activity"></i></div>
      <h1>FitTrack Pro</h1>
      <p>Fitness Tracker Dashboard</p>
    </div>

    <div class="login-card-body">
      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" autocomplete="username">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <button type="button" id="loginBtn" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </form>

      <div class="demo-hint mt-3">
        <i class="bi bi-info-circle"></i> Demo credentials: <strong>admin</strong> / <strong>password123</strong>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
